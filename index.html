<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Wonders Silhouette Identification Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-stone-800 to-stone-900 min-h-screen text-white">
<div class="max-w-2xl mx-auto p-4">
  <header class="mb-4 text-center">
    <h1 class="text-2xl font-bold text-amber-300">World Wonders Silhouette Quiz</h1>
    <p class="text-gray-400 text-sm mt-1">Identify the wonder from its silhouette — 14 rounds</p>
  </header>

  <!-- Progress -->
  <div class="flex justify-between items-center mb-3">
    <div class="text-sm text-gray-400">Round <span id="round">1</span> of 14</div>
    <div class="text-sm text-gray-400">Score: <span id="score" class="text-amber-300 font-bold">0</span> / <span id="outOf">0</span></div>
  </div>
  <div class="bg-gray-700 rounded-full h-2 mb-5">
    <div id="progressBar" class="bg-amber-400 h-2 rounded-full transition-all" style="width:0%"></div>
  </div>

  <!-- Quiz Section -->
  <div id="quizSection">
    <!-- Silhouette -->
    <div class="bg-stone-700 rounded-2xl p-6 mb-5 flex justify-center shadow-xl">
      <svg id="silhouetteSvg" viewBox="0 0 400 220" width="100%" height="220" aria-label="Wonder silhouette" role="img">
      </svg>
    </div>

    <!-- Choices -->
    <div id="choices" class="grid grid-cols-2 gap-3 mb-4"></div>

    <div id="feedback" class="hidden bg-stone-700 rounded-xl p-4" aria-live="polite"></div>
    <button id="nextBtn" onclick="nextRound()" class="hidden w-full mt-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-semibold py-3 rounded-xl transition">Next Wonder →</button>
  </div>

  <!-- Final Screen -->
  <div id="finalSection" class="hidden text-center">
    <div class="text-5xl mb-4">🏛️</div>
    <div class="text-3xl font-bold text-amber-300 mb-2">Quiz Complete!</div>
    <div class="text-xl mb-4">You scored <span id="finalScore" class="text-amber-300 font-bold"></span> / 14</div>
    <div id="finalRating" class="text-gray-300 mb-6"></div>
    <button onclick="startQuiz()" class="bg-amber-500 hover:bg-amber-400 text-gray-900 font-semibold px-8 py-3 rounded-xl transition">Play Again</button>
  </div>
</div>

<script>
const WONDERS = [
  {
    name: "Great Pyramid of Giza",
    location: "Giza, Egypt",
    year: "~2560 BCE",
    fact: "The only ancient wonder still largely intact, it was the world's tallest man-made structure for 3,800 years.",
    draw: (svg) => {
      svg.innerHTML = `
        <polygon points="200,30 50,190 350,190" fill="#1c1917" opacity="0.95"/>
        <line x1="0" y1="190" x2="400" y2="190" stroke="#1c1917" stroke-width="20"/>
        <polygon points="200,80 160,190 240,190" fill="#44403c" opacity="0.6"/>`;
    }
  },
  {
    name: "Colosseum",
    location: "Rome, Italy",
    year: "72–80 CE",
    fact: "Could hold 50,000–80,000 spectators and hosted gladiatorial contests, mock sea battles, and executions.",
    draw: (svg) => {
      svg.innerHTML = `
        <ellipse cx="200" cy="140" rx="170" ry="90" fill="#1c1917" opacity="0.95"/>
        <ellipse cx="200" cy="140" rx="130" ry="50" fill="#44403c"/>
        <rect x="30" y="80" width="340" height="110" rx="10" fill="#1c1917"/>
        <rect x="30" y="80" width="340" height="25" rx="4" fill="#292524"/>
        ${Array.from({length:12},(_,i)=>`<rect x="${48+i*27}" y="105" width="14" height="85" rx="3" fill="#44403c"/>`).join('')}
        <line x1="0" y1="190" x2="400" y2="190" stroke="#1c1917" stroke-width="20"/>`;
    }
  },
  {
    name: "Eiffel Tower",
    location: "Paris, France",
    year: "1889",
    fact: "Built as the entrance arch for the 1889 World's Fair, it was originally intended to be dismantled after 20 years.",
    draw: (svg) => {
      svg.innerHTML = `
        <polygon points="200,20 165,130 235,130" fill="#1c1917"/>
        <polygon points="200,130 130,190 270,190" fill="#1c1917"/>
        <rect x="145" y="120" width="110" height="8" fill="#1c1917"/>
        <rect x="155" y="155" width="90" height="7" fill="#1c1917"/>
        <rect x="130" y="185" width="140" height="10" fill="#1c1917"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#1c1917" stroke-width="15"/>`;
    }
  },
  {
    name: "Great Wall of China",
    location: "China",
    year: "7th century BCE – 17th century CE",
    fact: "Stretches over 21,000 km total, though it's not visible from space with the naked eye despite popular myth.",
    draw: (svg) => {
      svg.innerHTML = `
        <path d="M20,130 Q100,100 180,120 Q260,140 380,100" stroke="#1c1917" stroke-width="18" fill="none"/>
        ${Array.from({length:8},(_,i)=>{
          const x = 30+i*50; const y = 125-Math.sin(i*0.9)*20;
          return `<rect x="${x-8}" y="${y-20}" width="16" height="22" fill="#1c1917"/>`;
        }).join('')}
        <line x1="0" y1="155" x2="400" y2="155" stroke="#1c1917" stroke-width="35"/>`;
    }
  },
  {
    name: "Machu Picchu",
    location: "Cusco Region, Peru",
    year: "~1450 CE",
    fact: "Built by the Inca Empire at 2,430 metres altitude; it was unknown to the outside world until 1911.",
    draw: (svg) => {
      svg.innerHTML = `
        <polygon points="80,190 150,80 220,110 300,60 370,190" fill="#1c1917"/>
        <rect x="100" y="140" width="30" height="30" fill="#292524"/>
        <rect x="145" y="120" width="35" height="50" fill="#292524"/>
        <rect x="195" y="100" width="30" height="70" fill="#292524"/>
        <rect x="240" y="110" width="40" height="60" fill="#292524"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#1c1917" stroke-width="15"/>`;
    }
  },
  {
    name: "Taj Mahal",
    location: "Agra, India",
    year: "1632–1648 CE",
    fact: "Emperor Shah Jahan commissioned it as a mausoleum for his wife Mumtaz Mahal; it took 22 years and 20,000 workers.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="130" y="120" width="140" height="70" fill="#1c1917"/>
        <path d="M200,20 Q175,50 175,80 L225,80 Q225,50 200,20Z" fill="#1c1917"/>
        <rect x="175" y="78" width="50" height="45" rx="2" fill="#1c1917"/>
        <rect x="95" y="135" width="30" height="55" rx="3" fill="#292524"/>
        <rect x="275" y="135" width="30" height="55" rx="3" fill="#292524"/>
        <path d="M95,135 Q80,120 95,110 Q110,120 95,135Z" fill="#1c1917"/>
        <path d="M305,135 Q320,120 305,110 Q290,120 305,135Z" fill="#1c1917"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#1c1917" stroke-width="15"/>`;
    }
  },
  {
    name: "Chichen Itza",
    location: "Yucatán, Mexico",
    year: "~600–900 CE",
    fact: "El Castillo pyramid has exactly 365 steps total, one for each day of the year — a Mayan calendar in stone.",
    draw: (svg) => {
      svg.innerHTML = `
        <polygon points="200,50 100,160 300,160" fill="#1c1917"/>
        <polygon points="200,90 160,160 240,160" fill="#292524"/>
        <rect x="170" y="45" width="60" height="30" fill="#1c1917"/>
        <rect x="95" y="155" width="210" height="15" fill="#1c1917"/>
        <rect x="85" y="165" width="230" height="10" fill="#1c1917"/>
        <line x1="0" y1="178" x2="400" y2="178" stroke="#1c1917" stroke-width="20"/>`;
    }
  },
  {
    name: "Christ the Redeemer",
    location: "Rio de Janeiro, Brazil",
    year: "1922–1931",
    fact: "Standing 30 metres tall with a wingspan of 28 metres, it was struck by lightning during a 2014 storm.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="190" y="40" width="20" height="130" fill="#1c1917"/>
        <ellipse cx="200" cy="38" rx="18" ry="20" fill="#1c1917"/>
        <rect x="100" y="100" width="200" height="18" rx="4" fill="#1c1917"/>
        <polygon points="200,50 185,175 215,175" fill="#1c1917"/>
        <line x1="0" y1="180" x2="400" y2="180" stroke="#1c1917" stroke-width="25"/>`;
    }
  },
  {
    name: "Colossus of Rhodes",
    location: "Rhodes, Greece",
    year: "280 BCE",
    fact: "Stood ~33 metres tall guarding the harbor entrance; destroyed by earthquake in 226 BCE after only 54 years.",
    draw: (svg) => {
      svg.innerHTML = `
        <polygon points="195,30 175,80 215,80" fill="#1c1917"/>
        <rect x="175" y="75" width="50" height="55" rx="4" fill="#1c1917"/>
        <polygon points="200,130 160,190 240,190" fill="#1c1917"/>
        <line x1="150" y1="100" x2="100" y2="145" stroke="#1c1917" stroke-width="18" stroke-linecap="round"/>
        <line x1="250" y1="100" x2="310" y2="120" stroke="#1c1917" stroke-width="18" stroke-linecap="round"/>
        <rect x="115" y="185" width="170" height="15" rx="3" fill="#1c1917"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="#1c1917" stroke-width="10"/>`;
    }
  },
  {
    name: "Lighthouse of Alexandria",
    location: "Alexandria, Egypt",
    year: "~280 BCE",
    fact: "One of the tallest man-made structures for centuries, estimated at 100–130 metres; destroyed by earthquakes.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="175" y="170" width="60" height="20" fill="#1c1917"/>
        <rect x="185" y="110" width="40" height="65" fill="#1c1917"/>
        <rect x="165" y="65" width="80" height="50" fill="#1c1917"/>
        <rect x="178" y="30" width="44" height="40" fill="#1c1917"/>
        <polygon points="200,18 185,32 215,32" fill="#1c1917"/>
        <ellipse cx="200" cy="28" rx="10" ry="8" fill="#f59e0b" opacity="0.8"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#1c1917" stroke-width="15"/>`;
    }
  },
  {
    name: "Statue of Zeus at Olympia",
    location: "Olympia, Greece",
    year: "~435 BCE",
    fact: "Carved by sculptor Phidias, it stood ~13 metres tall inside the Temple of Zeus and was considered the finest statue in antiquity.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="165" y="170" width="80" height="20" fill="#1c1917"/>
        <rect x="175" y="110" width="60" height="65" fill="#1c1917"/>
        <ellipse cx="205" cy="105" rx="30" ry="28" fill="#1c1917"/>
        <polygon points="205,78 190,58 220,58" fill="#1c1917"/>
        <line x1="165" y1="140" x2="130" y2="170" stroke="#1c1917" stroke-width="16" stroke-linecap="round"/>
        <line x1="240" y1="135" x2="275" y2="155" stroke="#1c1917" stroke-width="16" stroke-linecap="round"/>
        <rect x="135" y="185" width="150" height="15" rx="2" fill="#1c1917"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="#1c1917" stroke-width="10"/>`;
    }
  },
  {
    name: "Petra",
    location: "Ma'an Governorate, Jordan",
    year: "~4th century BCE",
    fact: "Known as the 'Rose City' for its pink sandstone; it was carved directly into the cliff face by the Nabataean kingdom.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="100" y="50" width="200" height="145" fill="#1c1917"/>
        <polygon points="150,50 175,15 200,50" fill="#1c1917"/>
        <polygon points="200,50 225,15 250,50" fill="#1c1917"/>
        <rect x="170" y="120" width="60" height="75" rx="4" fill="#44403c"/>
        <rect x="120" y="80" width="30" height="60" rx="15" fill="#44403c"/>
        <rect x="255" y="80" width="30" height="60" rx="15" fill="#44403c"/>
        ${Array.from({length:4},(_,i)=>`<rect x="${120+i*35}" y="50" width="15" height="8" fill="#292524"/>`).join('')}
        <line x1="0" y1="198" x2="400" y2="198" stroke="#1c1917" stroke-width="12"/>`;
    }
  },
  {
    name: "Angkor Wat",
    location: "Siem Reap, Cambodia",
    year: "~1113–1150 CE",
    fact: "The world's largest religious monument, covering 162 hectares, originally dedicated to the Hindu god Vishnu.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="100" y="120" width="200" height="75" fill="#1c1917"/>
        <polygon points="200,30 178,90 222,90" fill="#1c1917"/>
        <rect x="178" y="88" width="44" height="35" fill="#1c1917"/>
        <polygon points="138,60 125,100 152,100" fill="#1c1917"/>
        <rect x="125" y="98" width="27" height="25" fill="#1c1917"/>
        <polygon points="263,60 250,100 277,100" fill="#1c1917"/>
        <rect x="250" y="98" width="27" height="25" fill="#1c1917"/>
        <rect x="80" y="145" width="240" height="12" fill="#292524"/>
        <line x1="0" y1="200" x2="400" y2="200" stroke="#1c1917" stroke-width="10"/>`;
    }
  },
  {
    name: "Roman Colosseum Ruins",
    location: "Rome, Italy",
    year: "72–80 CE",
    fact: "The outer wall collapsed in a 847 CE earthquake; the ruins were used as a quarry for stone to build St. Peter's Basilica.",
    draw: (svg) => {
      svg.innerHTML = `
        <rect x="30" y="60" width="340" height="130" rx="8" fill="#1c1917"/>
        <ellipse cx="200" cy="60" rx="170" ry="45" fill="none" stroke="#1c1917" stroke-width="30"/>
        <ellipse cx="200" cy="100" rx="130" ry="30" fill="#44403c"/>
        ${Array.from({length:10},(_,i)=>`<rect x="${38+i*33}" y="90" width="20" height="100" rx="3" fill="#44403c"/>`).join('')}
        <rect x="260" y="55" width="110" height="140" fill="#292524" opacity="0.8"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#1c1917" stroke-width="15"/>`;
    }
  },
];

let questions = [];
let qIndex = 0;
let totalScore = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;
}

function startQuiz() {
  questions = shuffle(WONDERS).slice(0, 14);
  qIndex = 0; totalScore = 0; answered = false;
  document.getElementById('quizSection').classList.remove('hidden');
  document.getElementById('finalSection').classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[qIndex];
  document.getElementById('round').textContent = qIndex + 1;
  document.getElementById('score').textContent = totalScore;
  document.getElementById('outOf').textContent = qIndex;
  document.getElementById('progressBar').style.width = `${(qIndex/14)*100}%`;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');

  // Draw silhouette
  q.draw(document.getElementById('silhouetteSvg'));

  // Build 4 choices (1 correct + 3 random wrong)
  const wrong = shuffle(WONDERS.filter(w => w.name !== q.name)).slice(0,3);
  const choices = shuffle([q, ...wrong]);
  document.getElementById('choices').innerHTML = choices.map(c =>
    `<button onclick="makeGuess('${c.name.replace(/'/g,"\\'")}', '${q.name.replace(/'/g,"\\'")}', this)"
      class="bg-stone-600 hover:bg-amber-500 hover:text-gray-900 border border-stone-500 rounded-xl py-3 px-3 text-sm font-medium transition text-left"
      aria-label="Answer: ${c.name}">${c.name}</button>`
  ).join('');
}

function makeGuess(guess, correct, btn) {
  if (answered) return;
  answered = true;
  const isCorrect = guess === correct;
  if (isCorrect) totalScore++;

  document.querySelectorAll('#choices button').forEach(b => {
    const label = b.getAttribute('aria-label').replace('Answer: ','');
    if (label === correct) b.className = 'bg-green-600 border-green-400 border rounded-xl py-3 px-3 text-sm font-bold text-white text-left';
    else if (label === guess && !isCorrect) b.className = 'bg-red-700 border-red-500 border rounded-xl py-3 px-3 text-sm font-medium text-white text-left';
    else b.className = 'bg-stone-700 border border-stone-600 rounded-xl py-3 px-3 text-sm font-medium text-gray-400 text-left';
    b.disabled = true;
  });

  const wonder = WONDERS.find(w => w.name === correct);
  const feedEl = document.getElementById('feedback');
  feedEl.innerHTML = `
    <div class="${isCorrect ? 'text-green-400' : 'text-red-400'} font-bold mb-2">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
    <div class="text-amber-200 font-semibold text-base mb-1">${wonder.name}</div>
    <div class="text-gray-400 text-sm">📍 ${wonder.location} &nbsp;•&nbsp; 🗓 ${wonder.year}</div>
    <div class="text-gray-300 text-sm mt-2">💡 ${wonder.fact}</div>`;
  feedEl.classList.remove('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('score').textContent = totalScore;
}

function nextRound() {
  qIndex++;
  if (qIndex >= 14) showFinal();
  else showQuestion();
}

function showFinal() {
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('finalSection').classList.remove('hidden');
  document.getElementById('finalScore').textContent = totalScore;
  document.getElementById('progressBar').style.width = '100%';
  const ratings = ['Keep exploring! 🌍','Not bad, adventurer! 🗺️','Good knowledge! 🏛️','Excellent! ⭐','World Wonder Expert! 🏆'];
  document.getElementById('finalRating').textContent = ratings[Math.floor(totalScore / 14 * (ratings.length-1))];
}

startQuiz();
</script>
</body>
</html>
